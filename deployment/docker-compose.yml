services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dinesense_db
      POSTGRES_USER: dinesense
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_prod}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql+psycopg2://dinesense:${POSTGRES_PASSWORD:-change_me_in_prod}@postgres:5432/dinesense_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-replace_with_secure_64_char_secret}
      APP_ENV: production
      RETENTION_DAYS: 90
      INFERENCE_PROVIDER: demo
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.frontend
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-replace_with_secure_64_char_secret}
    ports:
      - "3000:3000"

volumes:
  pg_data:
